version: '3.8'

services:
  # 1. PostgreSQL Database (Bronze / Silver / Gold Medallion & DWH)
  postgres:
    image: postgres:15-alpine
    container_name: supply_chain_postgres
    environment:
      POSTGRES_DB: supply_chain_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/complete_master_pipeline.sql:/docker-entrypoint-initdb.d/01_complete_master_pipeline.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supply_chain_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. MinIO S3-Compatible Data Lake Object Store
  minio:
    image: minio/minio:latest
    container_name: supply_chain_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 3. Zookeeper & Apache Kafka Streaming Cluster
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: supply_chain_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: supply_chain_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 4. Apache Spark Master & Worker
  spark-master:
    image: bitnami/spark:3.5.0
    container_name: supply_chain_spark_master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker:
    image: bitnami/spark:3.5.0
    container_name: supply_chain_spark_worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077

  # 5. Apache Airflow Orchestrator
  airflow:
    image: apache/airflow:2.8.1-python3.11
    container_name: supply_chain_airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/supply_chain_db
      - AIRFLOW__CORE__FERNET_KEY=46ExbZLiAsAy0Dx_154_YhMkcB5QUsdf29w_89asdsa=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    ports:
      - "8081:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/project

  # 6. Prometheus & Grafana Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: supply_chain_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: supply_chain_grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards

  # 7. Operational Digital Twin Web Dashboard
  web-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: supply_chain_dashboard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8050:8050"
    environment:
      - POSTGRES_HOST=postgres
      - MINIO_ENDPOINT=minio:9000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092

volumes:
  postgres_data:
  minio_data:

